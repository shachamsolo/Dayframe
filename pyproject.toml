[project]
name = "dayframe"
version = "0.1.0"
description = "AI memories from your photos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "osxphotos>=0.69; sys_platform == 'darwin'",
    "httpx>=0.27",
    "Pillow>=10.4",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "tenacity>=8.2,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
dayframe = "dayframe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dayframe"]

[tool.hatch.build.targets.wheel.force-include]
"dayframe/store/schema.sql" = "dayframe/store/schema.sql"
"prompts/system_v1.md" = "dayframe/prompts/system_v1.md"
"prompts/baseline_v1.md" = "dayframe/prompts/baseline_v1.md"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
